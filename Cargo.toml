[package]
name = "iya-pep"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["rcbjBlueMars <9321971+rcbjBlueMars@users.noreply.github.com>"]
description = "The iya-sts remote PEP, embedded in an application: a lightweight XACML engine, the control plane and the AuthZEN client"
repository = "https://github.com/rcbj/iya-pep-rust"
homepage = "https://github.com/rcbj/iya-pep-rust"
readme = "README.md"
keywords = ["xacml", "pep", "authzen", "authorization"]
categories = ["authentication"]

[dependencies]
base64 = "0.22"
native-tls = { version = "0.2", optional = true }
p256 = { version = "0.14", features = ["ecdsa", "pem", "getrandom"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false }
url = "2"
# The engine's, under `local`.
regex = { version = "1", optional = true, default-features = false, features = ["std", "unicode"] }
roxmltree = { version = "0.20", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
# The `rustls` TLS backend.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.9", optional = true, features = ["std"] }
webpki-roots = { version = "1.0", optional = true }

[features]
# One TLS backend. `native-tls` (OpenSSL on Linux) uses the platform's trust
# store; `rustls` uses webpki's roots and links no OpenSSL, for a host that
# already uses rustls. Either way `tlsCa` is added to those roots. With both
# on, rustls is used.
default = ["native-tls"]
native-tls = ["dep:native-tls", "ureq/native-tls"]
rustls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "ureq/tls"]
# The local PDP: the XACML engine and the policy pull. Without it, only
# `central` mode (AuthZEN at the service) is compiled.
local = ["dep:regex", "dep:roxmltree"]
# The background work as a task on the caller's tokio runtime, as
# oidc-caep-risc's `tokio` feature does. Without it, a thread.
tokio = ["dep:tokio"]

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[package.metadata.docs.rs]
all-features = true
